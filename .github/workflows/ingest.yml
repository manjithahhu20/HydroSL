name: HydroSL source ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HydroSL
        run: python -m pip install .

      - name: Fetch and normalize workbook
        run: hydrosl ingest --output data/warehouse

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrosl-warehouse-${{ github.run_id }}
          path: data/warehouse
          retention-days: 30
