name: HydroSL source ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HydroSL
        run: python -m pip install .

      - name: Fetch and normalize workbook
        run: hydrosl ingest --output data/warehouse

      - name: Export dashboard read models
        run: hydrosl export --warehouse data/warehouse --output apps/dashboard/data

      - name: Detect Blob credentials
        id: blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Blob publisher
        if: steps.blob.outputs.configured == 'true'
        run: npm ci

      - name: Publish dashboard data to Vercel Blob
        if: steps.blob.outputs.configured == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/publish_blob.mjs

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrosl-warehouse-${{ github.run_id }}
          path: data/warehouse
          retention-days: 30
